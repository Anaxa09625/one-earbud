<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分你一只耳机</title>
<link rel="stylesheet" href="styles/music.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f3f7;color:#2b2830;font-family:"Noto Serif SC","Songti SC",serif;min-height:100dvh}

/* ── 顶栏 ── */
.hp-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;position:sticky;top:0;z-index:10;background:rgba(246,243,247,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hp-status{display:flex;align-items:center;gap:6px;font:400 12px/1 "Noto Serif SC",serif;color:#8f8a95;cursor:pointer;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.6);border:0}
.hp-status .dot{width:7px;height:7px;border-radius:50%;flex:none}
.hp-status .dot.on{background:#7bc67e}.hp-status .dot.off{background:#ccc}
.hp-title{font:italic 400 18px/1 "Cormorant Garamond","Noto Serif SC",serif;color:#2b2830}
.hp-listen-btn{display:flex;align-items:center;gap:5px;font:400 12px/1 "Noto Serif SC",serif;color:#6f8394;padding:6px 10px;border-radius:999px;background:rgba(111,131,148,.08);border:0;cursor:pointer}
.hp-listen-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── 主内容 ── */
.hp-body{padding:0 14px calc(90px + env(safe-area-inset-bottom,0px));overflow-y:auto}

/* 搜索栏 */
.hp-search{display:flex;align-items:center;gap:8px;height:42px;border-radius:21px;background:#fff;padding:0 16px;margin:8px 0 14px;cursor:pointer;box-shadow:0 2px 10px rgba(42,38,46,.04)}
.hp-search svg{width:17px;height:17px;stroke:#8f8a95;fill:none;stroke-width:1.7;stroke-linecap:round;flex:none}
.hp-search span{font:400 14px/1 "Noto Serif SC",serif;color:#aaa6ad}

/* 当前播放卡片 */
.hp-now{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 10px rgba(42,38,46,.04)}
.hp-now[hidden]{display:none}
.hp-now .cover{width:48px;height:48px;border-radius:12px;flex:none;background:#e8e4ea center/cover no-repeat;animation:hp-spin 12s linear infinite;animation-play-state:paused}
.hp-now.is-playing .cover{animation-play-state:running;border-radius:50%}
.hp-now .info{flex:1;min-width:0}
.hp-now .info .t{font:500 15px/1.3 "Noto Serif SC",serif;color:#2b2830;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-now .info .a{font:400 12px/1.3 "Noto Serif SC",serif;color:#8f8a95;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-now .info .tag{display:inline-block;font:400 10px/1 "Noto Serif SC",serif;color:#6f8394;background:rgba(111,131,148,.1);padding:3px 7px;border-radius:999px;margin-top:4px}
.hp-now button{width:38px;height:38px;border:0;border-radius:50%;background:rgba(217,149,173,.12);color:#c97d9a;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.hp-now button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes hp-spin{to{transform:rotate(360deg)}}

/* 播放列表 */
.hp-queue{margin:0 0 12px}
.hp-queue h3{font:400 14px/1 "Noto Serif SC",serif;color:#8f8a95;margin:0 0 10px;padding:0 2px;display:flex;align-items:center;justify-content:space-between}
.hp-queue h3 button{border:0;background:none;font:400 12px/1 "Noto Serif SC",serif;color:#aaa6ad;cursor:pointer;padding:4px 0}
.hp-qi{background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(42,38,46,.03)}
.hp-qi.is-cur{background:rgba(217,149,173,.06)}
.hp-qi .cover{width:40px;height:40px;border-radius:8px;flex:none;background:#e8e4ea center/cover no-repeat}
.hp-qi .info{flex:1;min-width:0}
.hp-qi .info .t{font:400 14px/1.3 "Noto Serif SC",serif;color:#2b2830;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-qi .info .a{font:400 11px/1.3 "Noto Serif SC",serif;color:#aaa6ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-qi .info .n{font:400 11px/1.3 "Noto Serif SC",serif;color:#6f8394;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 底部播放条 ── */
.hp-bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(40,39,44,.06);padding:0 14px calc(env(safe-area-inset-bottom,0px) + 6px)}
.hp-bar[hidden]{display:none}
.hp-bar-inner{display:flex;align-items:center;gap:10px;height:56px;cursor:pointer}
.hp-bar .bar-disc{width:40px;height:40px;border-radius:50%;flex:none;background:#e8e4ea center/cover no-repeat;animation:hp-spin 12s linear infinite;animation-play-state:paused}
.hp-bar.is-playing .bar-disc{animation-play-state:running}
.hp-bar .bar-info{flex:1;min-width:0}
.hp-bar .bar-title{font:400 14px/1.3 "Noto Serif SC",serif;color:#2b2830;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-bar .bar-artist{font:400 11px/1.3 "Noto Serif SC",serif;color:#aaa6ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-bar button{width:34px;height:34px;border:0;border-radius:50%;background:none;color:#2b2830;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.hp-bar svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hp-bar .bar-progress{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(40,39,44,.06)}
.hp-bar .bar-progress i{display:block;height:100%;background:linear-gradient(90deg,#c97d9a,#d995ad);width:0;transition:width .3s}
.hp-bar .bar-listen{font:400 11px/1 "Noto Serif SC",serif;color:#6f8394;padding:5px 10px;border-radius:999px;background:rgba(111,131,148,.08);white-space:nowrap}

/* 空状态 */
.hp-empty{text-align:center;padding:40px 20px;color:#aaa6ad;font:400 13px/1.6 "Noto Serif SC",serif}
</style>
</head><body>

<!-- 顶栏 -->
<div class="hp-top">
  <button class="hp-status" id="login-status" onclick="location.href='login.html'">
    <span class="dot off"></span><span id="status-text">检查中…</span>
  </button>
  <span class="hp-title">分你一只耳机</span>
  <button class="hp-listen-btn" onclick="location.href='listen.html'">
    <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg>
    一起听
  </button>
</div>

<!-- 主内容 -->
<div class="hp-body">
  <!-- 搜索入口 -->
  <div class="hp-search" id="btn-search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <span>搜歌、歌手</span>
  </div>

  <!-- 正在播放 -->
  <div class="hp-now" id="now-card" hidden>
    <div class="cover" id="now-cover"></div>
    <div class="info">
      <div class="t" id="now-title"></div>
      <div class="a" id="now-artist"></div>
      <span class="tag" id="now-tag" hidden></span>
    </div>
    <button type="button" id="now-toggle" aria-label="播放/暂停"><svg viewBox="0 0 24 24" id="now-toggle-icon"><polygon points="5,3 19,12 5,21"/></svg></button>
  </div>

  <!-- 播放列表 -->
  <div class="hp-queue" id="queue-section" hidden>
    <h3>播放列表 <button type="button" id="btn-queue-all">查看全部</button></h3>
    <div id="queue-list"></div>
  </div>

  <!-- 空状态 -->
  <div class="hp-empty" id="empty-state">
    搜一首歌开始吧~<br>或者让沈晦给你放一首
  </div>
</div>

<!-- 底部播放条 -->
<div class="hp-bar" id="bottom-bar" hidden>
  <div class="bar-progress"><i id="bar-progress"></i></div>
  <div class="hp-bar-inner">
    <div class="bar-disc" id="bar-disc"></div>
    <div class="bar-info" id="bar-info-area">
      <div class="bar-title" id="bar-title">未在播放</div>
      <div class="bar-artist" id="bar-artist"></div>
    </div>
    <button type="button" id="bar-toggle" aria-label="播放/暂停"><svg viewBox="0 0 24 24" id="bar-toggle-icon"><polygon points="5,3 19,12 5,21"/></svg></button>
    <button type="button" id="bar-next" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z"/><line x1="19" y1="4" x2="19" y2="20"/></svg></button>
    <span class="bar-listen" id="bar-listen" onclick="location.href='listen.html'">一起听</span>
  </div>
</div>

<script type="module">
import { apiRequest, API_BASE } from './lib/api.js';
import { escapeHtml } from './lib/escape.js';
import * as player from './music/player.js';
import { openPlayerSheet, openSearchSheet, openQueueSheet } from './music/ui.js';

// ── 口令检查 ──
if (!localStorage.getItem('one-earbud.token')) location.href = 'login.html';

// ── 登录状态 ──
apiRequest(API_BASE + '/status').then(st => {
  const dot = document.querySelector('#login-status .dot');
  const text = document.getElementById('status-text');
  if (st.connected) {
    dot.className = 'dot on';
    const nick = (st.profile && st.profile.nickname) || '';
    text.textContent = nick || '已连接';
  } else {
    dot.className = 'dot off';
    text.textContent = '未登录';
  }
}).catch(() => {
  document.getElementById('status-text').textContent = '离线';
});

// ── 搜歌 ──
document.getElementById('btn-search').addEventListener('click', () => {
  openSearchSheet({
    onShareSong: (song) => player.playSingle(song, 0),
    onNeedLogin: () => { location.href = 'login.html'; }
  });
});

// ── 正在播放卡片 & 底部播放条 ──
const nowCard = document.getElementById('now-card');
const nowCover = document.getElementById('now-cover');
const nowTitle = document.getElementById('now-title');
const nowArtist = document.getElementById('now-artist');
const nowTag = document.getElementById('now-tag');
const nowToggleIcon = document.getElementById('now-toggle-icon');
const bottomBar = document.getElementById('bottom-bar');
const barDisc = document.getElementById('bar-disc');
const barTitle = document.getElementById('bar-title');
const barArtist = document.getElementById('bar-artist');
const barProgress = document.getElementById('bar-progress');
const barToggleIcon = document.getElementById('bar-toggle-icon');
const emptyState = document.getElementById('empty-state');

function coverUrl(url, size) { return url ? url + '?param=' + size + 'y' + size : ''; }

player.subscribe((st) => {
  const hasSong = st && st.song;
  const playing = hasSong && st.playing;

  // 正在播放卡片
  nowCard.hidden = !hasSong;
  nowCard.classList.toggle('is-playing', !!playing);
  if (hasSong) {
    nowTitle.textContent = st.song.title || '';
    nowArtist.textContent = st.song.artist || '';
    if (st.song.coverUrl) nowCover.style.backgroundImage = 'url(' + coverUrl(st.song.coverUrl, 96) + ')';
    // TA 放的标记
    if (st.addedBy === 'ta') {
      nowTag.hidden = false;
      nowTag.textContent = '沈晦放的';
    } else {
      nowTag.hidden = true;
    }
  }

  // 播放/暂停图标
  const pauseIcon = '<line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/>';
  const playIcon = '<polygon points="5,3 19,12 5,21"/>';
  nowToggleIcon.innerHTML = playing ? pauseIcon : playIcon;

  // 底部播放条
  bottomBar.hidden = !hasSong;
  bottomBar.classList.toggle('is-playing', !!playing);
  if (hasSong) {
    barTitle.textContent = st.song.title || '';
    barArtist.textContent = st.song.artist || '';
    if (st.song.coverUrl) barDisc.style.backgroundImage = 'url(' + coverUrl(st.song.coverUrl, 80) + ')';
    const dur = player.durationMs() || st.song.durationMs || 1;
    const pos = player.positionMs() || 0;
    barProgress.style.width = Math.min(100, pos / dur * 100) + '%';
  }
  barToggleIcon.innerHTML = playing ? pauseIcon : playIcon;

  // 空状态
  updateEmpty();
});

// 进度条更新
setInterval(() => {
  const st = player.getState();
  if (st && st.song && st.playing) {
    const dur = player.durationMs() || st.song.durationMs || 1;
    const pos = player.positionMs() || 0;
    barProgress.style.width = Math.min(100, pos / dur * 100) + '%';
  }
}, 500);

// 播放条操作
document.getElementById('now-toggle').addEventListener('click', e => { e.stopPropagation(); player.toggle(); });
nowCard.addEventListener('click', () => {
  openPlayerSheet({ onShareSong: () => {}, onShareLines: () => {} });
});
document.getElementById('bar-toggle').addEventListener('click', e => { e.stopPropagation(); player.toggle(); });
document.getElementById('bar-next').addEventListener('click', e => { e.stopPropagation(); player.next(); });
document.getElementById('bar-info-area').addEventListener('click', () => {
  openPlayerSheet({ onShareSong: () => {}, onShareLines: () => {} });
});

// ── 播放列表 ──
const queueSection = document.getElementById('queue-section');
const queueListEl = document.getElementById('queue-list');

function renderQueue() {
  const q = player.getQueue();
  if (!q.items || !q.items.length) { queueSection.hidden = true; updateEmpty(); return; }
  queueSection.hidden = false;
  // 只显示前 8 首
  const show = q.items.slice(0, 8);
  queueListEl.innerHTML = show.map(item => {
    const isCur = item.id === q.currentId;
    const covStyle = item.coverUrl ? 'background-image:url(' + escapeHtml(item.coverUrl + '?param=80y80') + ')' : '';
    return '<div class="hp-qi' + (isCur ? ' is-cur' : '') + '" data-id="' + escapeHtml(item.id) + '">'
      + '<div class="cover" style="' + covStyle + '"></div>'
      + '<div class="info"><div class="t">' + escapeHtml(item.title || '…') + '</div>'
      + '<div class="a">' + escapeHtml(item.artist || '') + '</div>'
      + (item.note && item.addedBy === 'ta' ? '<div class="n">沈晦：' + escapeHtml(item.note) + '</div>' : '')
      + '</div></div>';
  }).join('');
  updateEmpty();
}

function updateEmpty() {
  const q = player.getQueue();
  const hasSong = player.getState() && player.getState().song;
  const hasQueue = q.items && q.items.length;
  emptyState.hidden = hasSong || hasQueue;
}

player.subscribeQueue(renderQueue);
queueListEl.addEventListener('click', e => {
  const qi = e.target.closest('.hp-qi');
  if (qi) player.playQueueItem(qi.dataset.id);
});

document.getElementById('btn-queue-all').addEventListener('click', () => {
  openQueueSheet({ onShareSong: () => {} });
});

// ── 初始化 ──
player.refreshQueue();
setInterval(() => player.refreshQueue(), 8000);
</script>
</body></html>
