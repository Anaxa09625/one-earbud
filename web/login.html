<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分你一只耳机 · 网易云登录</title>
<style>
body{margin:0;background:#f6f3f7;color:#2b2830;font-family:"Songti SC","Noto Serif SC",serif}
main{max-width:460px;margin:0 auto;padding:28px 18px}
.oe-title{font-size:22px;margin:0 0 4px}.oe-sub{color:#8f8a95;font-size:13px;margin:0 0 18px}
.oe-card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.oe-label{font-size:13px;color:#8f8a95;margin-bottom:6px}.oe-value{font-size:16px;margin-bottom:8px}
.oe-help{font-size:13px;line-height:1.7;color:#6b6670}
.oe-btn{border:0;border-radius:999px;padding:10px 18px;background:#f0ecf3;color:#2b2830;font:inherit;font-size:14px}
.oe-btn.is-go{background:#d995ad;color:#fff}
.oe-qr{width:220px;height:220px;image-rendering:pixelated;background:#fff;border-radius:12px;padding:8px}
.oe-back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:10;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.86);color:#2b2830;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.oe-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<button class="oe-back" onclick="location.href='index.html'" aria-label="返回首页"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
<main id="app"></main>
<script type="module">
import { mountMusicLogin } from './login.js';
// 如果 localStorage 里没口令，先让用户输入
const saved = localStorage.getItem('one-earbud.token');
if (!saved) {
  const app = document.getElementById('app');
  app.innerHTML = '<h1 class="oe-title">分你一只耳机</h1><p class="oe-sub">先输入访问口令</p>'
    + '<section class="oe-card"><div class="oe-label">口令</div>'
    + '<input id="tk" type="text" placeholder="你在 Render 环境变量里设的 ONE_EARBUD_TOKEN" '
    + 'style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e0dce3;border-radius:12px;font:inherit;font-size:15px;margin-bottom:12px">'
    + '<button type="button" class="oe-btn is-go" id="go" style="width:100%">确认</button></section>';
  document.getElementById('go').addEventListener('click', () => {
    const v = document.getElementById('tk').value.trim();
    if (!v) return alert('口令不能为空');
    localStorage.setItem('one-earbud.token', v);
    mountMusicLogin({ host: app });
  });
  document.getElementById('tk').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
} else {
  mountMusicLogin({ host: document.getElementById('app') });
}
</script>
</body></html>
